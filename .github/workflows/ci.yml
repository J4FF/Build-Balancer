# Does Build Balancer build on Windows, Linux and macOS, and do its programs work together
# there?  Each system builds all four programs, runs a whole fleet on the runner
# (tools/smoke.sh: relay, main machine, worker, jobs, cleaning up, a worker that dies and comes
# back) and walks through the desktop app's pages without a display (gui/tests/demo.uis).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: Linux, os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { name: macOS, os: macos-latest, target: aarch64-apple-darwin }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }} --no-self-update
          rustup default stable
          rustc --version
      # always with --target: .cargo/config.toml's flags for the static Linux programs must
      # not reach the build scripts
      - name: Build
        run: cargo build --locked --workspace --target ${{ matrix.target }}
      # (the time limits: a test that waits for what never comes ends, with its output)
      - name: A whole fleet on this machine
        timeout-minutes: 10
        run: sh tools/smoke.sh target/${{ matrix.target }}/debug
      # a release made on the spot, fetched, checked and installed by install.sh / install.ps1
      - name: The install script
        timeout-minutes: 10
        run: sh tools/install-test.sh target/${{ matrix.target }}/debug
      # a "newer release" made on the spot: bb update, a worker that updates itself on the main
      # machine's word and starts again, a download that does not match its checksum
      - name: The programs updating themselves
        timeout-minutes: 20
        run: sh tools/update-test.sh target/${{ matrix.target }}/debug
      # what needs root and systemd: the services run as the person who installs them, on the
      # data folder that person already has, and a server is set up by one command
      - name: The programs as system services
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          BB_SERVICE_TEST: 1
        run: sh tools/service-test.sh target/${{ matrix.target }}/debug
      - name: The desktop app's pages
        timeout-minutes: 5
        run: |
          mkdir -p target/shots
          target/${{ matrix.target }}/debug/BuildBalancer --demo --script gui/tests/demo.uis
