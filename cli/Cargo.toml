[package]
name = "bb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

# the main machine's logic as a library: the Build Balancer app uses it too
[lib]
name = "bb_main"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "bb"
path = "src/main.rs"
test = false
bench = false

[dependencies]
rt.workspace = true
plat.workspace = true
base.workspace = true
crypto.workspace = true
netio.workspace = true
agent_core.workspace = true
bb_core.workspace = true
bb_sync.workspace = true
bb_exec.workspace = true
agent_io.workspace = true

[build-dependencies]
jflib-build.workspace = true
