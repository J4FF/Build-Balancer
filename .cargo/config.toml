# What a build script cannot set.  rust-lld comes with rustup, so neither target needs a C
# toolchain or a Windows SDK, and both build from Windows and from Linux alike.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld"

[target.aarch64-pc-windows-msvc]
linker = "rust-lld"

# Linux programs are one static file each, linked by rust-lld.  Always build them with --target
# (also on Linux): only then Cargo keeps these flags away from the build scripts, which are
# programs of the machine that builds.  That is also why the linker is named here, among the
# flags, and not as `linker = ...`: that setting would reach the build scripts on a Linux
# machine even with --target, and they need the system's own linker.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "linker=rust-lld", "-C", "linker-flavor=ld.lld", "-C", "target-feature=+crt-static", "-C", "relocation-model=static"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "linker=rust-lld", "-C", "linker-flavor=ld.lld", "-C", "target-feature=+crt-static", "-C", "relocation-model=static"]

[alias]
win = "build --release --target x86_64-pc-windows-msvc"
linux = "build --release --target x86_64-unknown-linux-gnu"
