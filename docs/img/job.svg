<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 214" width="960" height="214" role="img" aria-labelledby="t d" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">What happens when you run a build</title>
  <desc id="d">The main machine compares your project folder with the worker's copy and sends only the files that changed, encrypted. The worker runs your command on the processors it lends and collects the files you named. The results land in your project folder.</desc>
  <rect x="0.5" y="0.5" width="959" height="213" rx="16" fill="#F4F6FA" stroke="#D5DBE5"/>

  <rect x="32" y="20" width="262" height="30" rx="6" fill="#1B2430"/>
  <text x="46" y="40" font-size="13.5" fill="#FFFFFF" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">bb run -- cargo build --release</text>

  <!-- five steps; the tag says where each one happens -->
  <g font-size="12.5">
    <g>
      <rect x="32" y="68" width="168" height="122" rx="12" fill="#FFFFFF" stroke="#D5DBE5"/>
      <rect x="46" y="82" width="64" height="20" rx="10" fill="#E3EDF9"/>
      <text x="78" y="96" font-size="11.5" font-weight="600" fill="#1F5FAE" text-anchor="middle">main PC</text>
      <text x="46" y="128" font-size="16" font-weight="600" fill="#1B2430">1  Compare</text>
      <text x="46" y="152" fill="#5A6575">your folder with the</text>
      <text x="46" y="170" fill="#5A6575">worker's copy</text>
    </g>
    <g>
      <rect x="214" y="68" width="168" height="122" rx="12" fill="#FFFFFF" stroke="#D5DBE5"/>
      <rect x="228" y="82" width="64" height="20" rx="10" fill="#E3EDF9"/>
      <text x="260" y="96" font-size="11.5" font-weight="600" fill="#1F5FAE" text-anchor="middle">main PC</text>
      <text x="228" y="128" font-size="16" font-weight="600" fill="#1B2430">2  Send</text>
      <text x="228" y="152" fill="#5A6575">only changed files,</text>
      <text x="228" y="170" fill="#5A6575">encrypted</text>
    </g>
    <g>
      <rect x="396" y="68" width="168" height="122" rx="12" fill="#FFFFFF" stroke="#D5DBE5"/>
      <rect x="410" y="82" width="58" height="20" rx="10" fill="#E2F2E8"/>
      <text x="439" y="96" font-size="11.5" font-weight="600" fill="#236B45" text-anchor="middle">worker</text>
      <text x="410" y="128" font-size="16" font-weight="600" fill="#1B2430">3  Build</text>
      <text x="410" y="152" fill="#5A6575">your command, on the</text>
      <text x="410" y="170" fill="#5A6575">lent processors</text>
    </g>
    <g>
      <rect x="578" y="68" width="168" height="122" rx="12" fill="#FFFFFF" stroke="#D5DBE5"/>
      <rect x="592" y="82" width="58" height="20" rx="10" fill="#E2F2E8"/>
      <text x="621" y="96" font-size="11.5" font-weight="600" fill="#236B45" text-anchor="middle">worker</text>
      <text x="592" y="128" font-size="16" font-weight="600" fill="#1B2430">4  Collect</text>
      <text x="592" y="152" fill="#5A6575">the files you named</text>
      <text x="592" y="170" fill="#5A6575">with --out</text>
    </g>
    <g>
      <rect x="760" y="68" width="168" height="122" rx="12" fill="#FFFFFF" stroke="#D5DBE5"/>
      <rect x="774" y="82" width="64" height="20" rx="10" fill="#E3EDF9"/>
      <text x="806" y="96" font-size="11.5" font-weight="600" fill="#1F5FAE" text-anchor="middle">main PC</text>
      <text x="774" y="128" font-size="16" font-weight="600" fill="#1B2430">5  Receive</text>
      <text x="774" y="152" fill="#5A6575">results land in your</text>
      <text x="774" y="170" fill="#5A6575">project folder</text>
    </g>
  </g>
  <g fill="none" stroke="#1F5FAE" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M204 122 L210 129 L204 136"/>
    <path d="M386 122 L392 129 L386 136"/>
    <path d="M568 122 L574 129 L568 136"/>
    <path d="M750 122 L756 129 L750 136"/>
  </g>
  <text x="928" y="40" font-size="12.5" fill="#5A6575" text-anchor="end">The worker keeps its copy and its build cache: the next build is incremental.</text>
</svg>
