<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 256" width="960" height="256" role="img" aria-labelledby="t d" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
  <title id="t">Setting up Build Balancer in three steps</title>
  <desc id="d">Step 1: start bb-relay and copy the line it prints. Step 2: on your main PC open BuildBalancer, choose "This is my main machine" and paste the line. Step 3: on every other PC open BuildBalancer, choose "This machine lends power" and enter the code your main PC shows.</desc>
  <rect x="0.5" y="0.5" width="959" height="255" rx="16" fill="#F4F6FA" stroke="#D5DBE5"/>

  <!-- 1 -->
  <rect x="24" y="30" width="288" height="196" rx="12" fill="#FFFFFF" stroke="#D5DBE5"/>
  <circle cx="58" cy="68" r="17" fill="#1F5FAE"/>
  <text x="58" y="74" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="86" y="74" font-size="17" font-weight="600" fill="#1B2430">Start the relay</text>
  <text x="44" y="108" font-size="12.5" fill="#5A6575">on a small server, or on your main PC</text>
  <text x="44" y="138" font-size="13.5" fill="#1B2430">Run the program</text>
  <rect x="44" y="150" width="92" height="30" rx="6" fill="#1B2430"/>
  <text x="90" y="170" font-size="13.5" fill="#FFFFFF" text-anchor="middle" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace">bb-relay</text>
  <text x="44" y="206" font-size="13.5" fill="#1B2430">It prints one line. Copy it.</text>

  <!-- 2 -->
  <rect x="336" y="30" width="288" height="196" rx="12" fill="#FFFFFF" stroke="#D5DBE5"/>
  <circle cx="370" cy="68" r="17" fill="#1F5FAE"/>
  <text x="370" y="74" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="398" y="74" font-size="17" font-weight="600" fill="#1B2430">Set up your main PC</text>
  <text x="356" y="108" font-size="12.5" fill="#5A6575">the PC you work on</text>
  <text x="356" y="138" font-size="13.5" fill="#1B2430">Open BuildBalancer and choose</text>
  <rect x="356.5" y="150.5" width="196" height="29" rx="6" fill="#E3EDF9" stroke="#1F5FAE"/>
  <text x="454.5" y="170" font-size="13" font-weight="600" fill="#1F5FAE" text-anchor="middle">This is my main machine</text>
  <text x="356" y="206" font-size="13.5" fill="#1B2430">Paste the line. Click Set up.</text>

  <!-- 3 -->
  <rect x="648" y="30" width="288" height="196" rx="12" fill="#FFFFFF" stroke="#D5DBE5"/>
  <circle cx="682" cy="68" r="17" fill="#1F5FAE"/>
  <text x="682" y="74" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="710" y="74" font-size="17" font-weight="600" fill="#1B2430">Add your other PCs</text>
  <text x="668" y="108" font-size="12.5" fill="#5A6575">laptop, old tower, Linux box, Mac</text>
  <text x="668" y="138" font-size="13.5" fill="#1B2430">Open BuildBalancer there, choose</text>
  <rect x="668.5" y="150.5" width="204" height="29" rx="6" fill="#E3EDF9" stroke="#1F5FAE"/>
  <text x="770.5" y="170" font-size="13" font-weight="600" fill="#1F5FAE" text-anchor="middle">This machine lends power</text>
  <text x="668" y="206" font-size="13.5" fill="#1B2430">Enter the code your main PC shows.</text>

  <!-- the way from one to the next -->
  <g fill="none" stroke="#1F5FAE" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M320.5 120 L327.5 128 L320.5 136"/>
    <path d="M632.5 120 L639.5 128 L632.5 136"/>
  </g>
</svg>
