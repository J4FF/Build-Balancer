<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-labelledby="t">
  <title id="t">Build Balancer</title>
  <!-- Two loads of the same weight on a level beam: the build, spread evenly.
       tools/mkicon.py draws the same shapes for the app's icon (gui/res/app.ico). -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2D74C8"/>
      <stop offset="1" stop-color="#184E94"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#g)"/>
  <rect x="22" y="28" width="32" height="32" rx="7" fill="#FFFFFF"/>
  <rect x="74" y="28" width="32" height="32" rx="7" fill="#FFFFFF" fill-opacity="0.7"/>
  <rect x="14" y="64" width="100" height="10" rx="5" fill="#FFFFFF"/>
  <path d="M64 77 L81 99 H47 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="6" stroke-linejoin="round"/>
</svg>
